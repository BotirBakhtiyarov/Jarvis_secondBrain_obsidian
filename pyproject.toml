[project]
name = "orion-second-brain"
version = "0.8.0"
description = "ORION — Operational Reasoning, Intelligence & Orchestration Network. Personal AI Second Brain + Coding Assistant powered by DeepSeek and Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "rich",
    "python-dotenv",
    "prompt-toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
mcp = [
    "mcp<2",
]
semantic = [
    "fastembed",
]

# uv foydalanuvchilari uchun: `uv sync` bu guruhlarni sukut bo'yicha
# o'rnatadi (pip uchun yuqoridagi extras saqlanadi).
[dependency-groups]
dev = [
    "pytest",
]
mcp = [
    "mcp<2",
]
semantic = [
    "fastembed",
]

[tool.uv]
default-groups = ["dev", "mcp", "semantic"]

[project.scripts]
orion = "orion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion"]
