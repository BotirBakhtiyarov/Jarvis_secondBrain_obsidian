[project]
name = "jarvis-second-brain"
version = "0.6.1"
description = "Personal AI Second Brain + Coding Assistant powered by DeepSeek and Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "rich",
    "python-dotenv",
    "prompt-toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
mcp = [
    "mcp<2",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
