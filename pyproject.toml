[project]
name = "orion-second-brain"
version = "0.9.0"
description = "ORION — Operational Reasoning, Intelligence & Orchestration Network. Personal AI Second Brain + Coding Assistant powered by DeepSeek and Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "rich",
    "python-dotenv",
    "prompt-toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
mcp = [
    "mcp<2",
]
semantic = [
    "fastembed",
]

# uv foydalanuvchilari uchun: `uv sync` bu guruhlarni sukut bo'yicha
# o'rnatadi (pip uchun yuqoridagi extras saqlanadi).
[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
mcp = [
    "mcp<2",
]
semantic = [
    "fastembed",
]

[tool.uv]
default-groups = ["dev", "mcp", "semantic"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Line length is handled by the formatter, not the linter.
    "E501",
    # run_turn() defines its closure fresh each loop iteration and consumes
    # it synchronously, so late binding is not a real bug here.
    "B023",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that download models or otherwise need network access",
]

[project.scripts]
orion = "orion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion"]
